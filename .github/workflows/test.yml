name: test

# 모든 브랜치의 push마다 실행한다. Actions 탭의 "Run workflow" 버튼으로 직접 돌릴 수도 있다.
on:
  push:
  pull_request:
  workflow_dispatch:

# 같은 브랜치에 새 커밋이 올라오면 이전 실행은 취소한다.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test tools
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          python -m pip install -r requirements-test.txt
          python -m playwright install chromium

      # node · browser(콘솔 테스트 + GPU 검사) · py 세 묶음. --strict: 준비 안 된 묶음도 실패로 친다.
      - name: Run all tests
        run: npm run test:ci
