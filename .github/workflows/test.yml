name: test

# 모든 브랜치의 push마다 실행한다. Actions 탭의 "Run workflow" 버튼으로 직접 돌릴 수도 있다.
on:
  push:
  pull_request:
  workflow_dispatch:

# 같은 브랜치에 새 커밋이 올라오면 이전 실행은 취소한다.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 정적 검사. 테스트와 따로 돌려서, lint가 실패해도 테스트 결과는 그대로 볼 수 있다.
  # 오류(버그 규칙)만 실패로 치고, 경고는 로그에만 남긴다.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install lint tools
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Run ESLint
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test tools
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          python -m pip install -r requirements-test.txt
          python -m playwright install chromium

      # node · browser(콘솔 테스트 + GPU 검사) · py 세 묶음. --strict: 준비 안 된 묶음도 실패로 친다.
      - name: Run all tests
        run: npm run test:ci

      # 테스트가 모두 통과하면 한 파일짜리 배포본을 만들어 실행 페이지의 Artifacts에 올린다.
      - name: Build single-file deploy
        run: npm run build

      - uses: actions/upload-artifact@v5
        with:
          name: field-studio-deploy
          path: deploy/index.html
          if-no-files-found: error
