name: format

# Actions 탭 → format → "Run workflow" 버튼으로만 돈다(push 때는 돌지 않는다).
# js/와 tools/에 Prettier를 적용하고, SHA 목록을 갱신하고, lint와 전체 테스트가 통과하면 그 결과를 같은 브랜치에 커밋한다.
# 테스트가 하나라도 실패하면 커밋하지 않는다. 고칠 파일 목록과 실패 로그만 남는다.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: "통과하면 커밋·push까지 한다 (끄면 바뀔 파일만 보여 준다)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          python -m pip install -r requirements-test.txt
          python -m playwright install chromium

      - name: Run Prettier
        run: npm run format

      # 런타임 파일(js/*.js)이 바뀌었으므로 runtime-integrity.js가 보는 SHA 목록을 다시 만든다.
      - name: Update SHA manifest
        run: python tools/update_sha_manifest.py

      - name: Show changed files
        run: git diff --stat

      - name: Lint
        run: npm run lint

      - name: Run all tests
        run: npm run test:ci

      - name: Build single-file deploy
        run: npm run build

      # 빌드 결과(deploy/)는 커밋하지 않는다. 소스와 SHA 목록만 올린다.
      - name: Commit and push
        if: inputs.commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js tools SOURCE_SHA256_Runtime.txt
          if git diff --cached --quiet; then echo "바뀐 파일이 없습니다."; exit 0; fi
          git commit -m "style: Prettier 적용 (js/, tools/)" -m "format 워크플로가 실행. lint · 전체 테스트 · 빌드 통과 후 커밋."
          git push
